<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Card number recognition workflow</title>
  <desc id="desc">A card image is corrected, a number ROI is prepared, digit boxes are matched to templates, and a number is output.</desc>
  <rect width="760" height="330" fill="#f8fafc"/>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Traditional card-number template-matching workflow</text>
  <g transform="translate(35 80)">
    <rect width="150" height="96" rx="12" fill="#92400e" stroke="#78350f" stroke-width="3"/>
    <rect x="20" y="20" width="38" height="30" rx="4" fill="#facc15"/><text x="21" y="76" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">4321 9876</text>
    <text x="24" y="124" font-family="Arial, sans-serif" font-size="16" fill="#334155">rotated card</text>
  </g>
  <path d="M198 127H265" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(280 80)">
    <rect width="150" height="96" rx="12" fill="#92400e" stroke="#78350f" stroke-width="3"/>
    <rect x="15" y="53" width="120" height="26" fill="none" stroke="#ef4444" stroke-width="3"/><text x="17" y="75" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">4321 9876</text>
    <text x="18" y="124" font-family="Arial, sans-serif" font-size="16" fill="#334155">correct + ROI</text>
  </g>
  <path d="M443 127H510" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(525 80)">
    <rect width="190" height="96" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <g font-family="Consolas, monospace" font-size="23" font-weight="700" fill="#1e293b"><text x="16" y="58">4 3 2 1 9 8 7 6</text></g>
    <text x="18" y="124" font-family="Arial, sans-serif" font-size="16" fill="#334155">segment + compare 0–9</text>
  </g>
  <path d="M620 200V239" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="248" y="252" width="270" height="48" rx="24" fill="#1e293b"/>
  <text x="307" y="283" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#fff">4321 9876 5012 3456</text>
  <text x="137" y="222" font-family="Arial, sans-serif" font-size="16" fill="#475569">CLAHE → threshold → contours → templates → scores</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
</svg>
