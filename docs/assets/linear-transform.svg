<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Brightness and contrast linear transform</title>
  <desc id="desc">An input intensity scale maps to output scales under contrast alpha and brightness beta changes.</desc>
  <rect width="760" height="300" fill="#f8fafc"/>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e293b">g(x) = alpha × f(x) + beta</text>
  <text x="32" y="66" font-family="Arial, sans-serif" font-size="16" fill="#475569">alpha changes contrast; beta shifts brightness.</text>
  <defs><linearGradient id="gray" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
  <text x="42" y="112" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">input f(x)</text>
  <rect x="42" y="126" width="210" height="46" rx="7" fill="url(#gray)" stroke="#64748b"/>
  <text x="42" y="197" font-family="Arial, sans-serif" font-size="15" fill="#475569">0</text><text x="235" y="197" font-family="Arial, sans-serif" font-size="15" fill="#475569">255</text>
  <path d="M282 149H365" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(405 90)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626">alpha &gt; 1</text>
    <rect x="0" y="35" width="260" height="42" rx="7" fill="url(#gray)" stroke="#dc2626" stroke-width="3"/>
    <path d="M42 33V79M217 33V79" stroke="#dc2626" stroke-width="4"/>
    <text x="0" y="109" font-family="Arial, sans-serif" font-size="15" fill="#475569">contrast expands</text>
    <text x="0" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">beta &gt; 0</text>
    <rect x="0" y="160" width="260" height="42" rx="7" fill="url(#gray)" stroke="#2563eb" stroke-width="3"/>
    <path d="M0 181H24" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="0" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">brightness shifts right</text>
  </g>
</svg>
