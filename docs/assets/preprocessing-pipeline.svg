<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">Image preprocessing pipeline</title>
  <desc id="desc">A noisy image becomes a smoothed grayscale image and then a binary image after thresholding.</desc>
  <rect width="760" height="270" fill="#f8fafc"/>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Preprocessing removes uncertainty before analysis</text>
  <g transform="translate(40 78)">
    <rect width="150" height="110" rx="10" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <circle cx="46" cy="44" r="24" fill="#fbbf24"/><path d="M0 110L50 58L90 90L120 44L150 110Z" fill="#2563eb"/>
    <g fill="#111827" opacity=".7"><circle cx="20" cy="20" r="3"/><circle cx="106" cy="21" r="3"/><circle cx="130" cy="70" r="3"/><circle cx="75" cy="96" r="3"/></g>
    <text x="32" y="137" font-family="Arial, sans-serif" font-size="16" fill="#334155">input + noise</text>
  </g>
  <path d="M210 133H285" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><text x="225" y="113" font-family="Arial, sans-serif" font-size="15" fill="#475569">blur</text>
  <g transform="translate(305 78)">
    <rect width="150" height="110" rx="10" fill="#d1d5db" stroke="#64748b" stroke-width="3"/>
    <circle cx="46" cy="44" r="24" fill="#e5e7eb"/><path d="M0 110L50 58L90 90L120 44L150 110Z" fill="#6b7280"/>
    <text x="27" y="137" font-family="Arial, sans-serif" font-size="16" fill="#334155">smoothed gray</text>
  </g>
  <path d="M475 133H550" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><text x="482" y="113" font-family="Arial, sans-serif" font-size="15" fill="#475569">threshold</text>
  <g transform="translate(570 78)">
    <rect width="150" height="110" rx="10" fill="#000" stroke="#64748b" stroke-width="3"/>
    <circle cx="46" cy="44" r="24" fill="#fff"/><path d="M0 110L50 58L90 90L120 44L150 110Z" fill="#fff"/>
    <text x="27" y="137" font-family="Arial, sans-serif" font-size="16" fill="#334155">binary result</text>
  </g>
  <text x="190" y="236" font-family="Arial, sans-serif" font-size="16" fill="#475569">border padding protects filter neighborhoods at image edges</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
</svg>
