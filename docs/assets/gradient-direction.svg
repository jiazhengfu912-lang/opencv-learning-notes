<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">Gradient direction is perpendicular to an edge</title>
  <desc id="desc">A dark region and bright region meet at a vertical edge. An arrow points from dark to bright along the horizontal gradient direction.</desc>
  <rect width="760" height="280" fill="#f8fafc"/>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Gradient measures the fastest brightness change</text>
  <rect x="55" y="76" width="275" height="140" fill="#1f2937" rx="5"/>
  <rect x="330" y="76" width="275" height="140" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M330 66V226" stroke="#ef4444" stroke-width="7"/>
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">dark</text>
  <text x="431" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e293b">bright</text>
  <path d="M188 146H458" stroke="#f59e0b" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="204" y="122" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#b45309">gradient direction (Gx)</text>
  <text x="621" y="153" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626">edge</text>
  <text x="106" y="254" font-family="Arial, sans-serif" font-size="16" fill="#475569">The gradient arrow starts at the current pixel and is perpendicular to the edge.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker></defs>
</svg>
